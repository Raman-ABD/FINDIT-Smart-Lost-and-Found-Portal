<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | FINDIT</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brand-icon">F</span> FINDIT</a>
<main class="auth-card"><span class="eyebrow">JOIN THE COMMUNITY</span><h1>Create account</h1><p class="muted">A few details to get started.</p>
<form id="registerForm"><label>Full name<input id="name" required maxlength="80" placeholder="Your name"></label><label>Email address<input type="email" id="email" required placeholder="you@example.com"></label><label>Password<input type="password" id="password" required minlength="4" placeholder="Create a password"></label><button class="button primary full" type="submit">Create Account</button></form>
<p class="form-foot">Already registered? <a href="login.html">Login</a></p><div id="message" class="message"></div></main><script src="app.js"></script></body></html>
